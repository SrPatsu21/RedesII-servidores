services:
    bind9:
        image: ubuntu/bind9:edge
        container_name: bind9-container
        restart: unless-stopped
        env_file:
          - .env
        environment:
          - TZ=UTC
        volumes:
          - ./bind9_config:/etc/bind
        ports:
          - "${BIND9_PORT}:53/tcp"
          - "${BIND9_PORT}:53/udp"
        networks:
          - internal-bind

networks:
    internal-bind:
        name: internal-bind
        driver: bridge
