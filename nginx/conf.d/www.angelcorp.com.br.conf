# Servidor HTTP (porta 80) - Redireciona para HTTPS
server {
    listen 80;
    server_name www.angelcorp.com.br;
    # Redireciona todo o tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
}
# Servidor HTTPS (porta 443)
server {
    listen 443 ssl;
    server_name www.angelcorp.com.br;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    add_header Strict-Transport-Security "max- age=31536000; includeSubDomains" always
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self';";

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    root /etc/nginx/html/www;
    index index.html index.htm;
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/www.angelcorp.com.br_access.log;
    error_log /var/log/nginx/www.angelcorp.com.br_error.log;
}
